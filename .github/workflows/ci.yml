name: CI

on:
  push:
  pull_request:

# Every job only reads the repository: none pushes, comments or deploys.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: keep the token out of .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned linter
        run: python -m pip install ruff==0.16.9

      - name: Lint Python for definite defects (ruff.toml)
        run: ruff check --output-format github .

  vercel-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: keep the token out of .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Vercel installs from uv.lock with `uv sync --frozen --no-dev`, which does not check the
      # lock against pyproject.toml, so CI does: a stale lock would deploy stale versions.
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install exactly what Vercel installs (uv.lock)
        run: uv sync --frozen --no-dev

      - name: Smoke-test committed Vercel profile and model
        run: .venv/bin/python website/tests/vercel_runtime_smoke.py

      - name: Smoke-test synthetic controls (not release evidence)
        run: |
          .venv/bin/python website/tools/evaluate_public_corpus.py --manifest website/tests/fixtures/evaluation/manifest.json --output /tmp/evaluation-candidate.json
          .venv/bin/python website/tools/compare_evaluations.py --baseline website/tests/fixtures/evaluation/baseline.json --candidate /tmp/evaluation-candidate.json

      - name: Check Vercel dependency consistency
        run: uv pip check --python .venv/bin/python

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: keep the token out of .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Redis from Ubuntu's packages, not a service container: a container is pulled from a
      # registry, and both Docker Hub (2026-10-09) and Amazon ECR Public (2026-10-12: "Data
      # limit exceeded") refused the pull and stopped the job before any test ran.
      - name: Start Redis for the integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          redis-cli ping || sudo redis-server --daemonize yes --port 6379
          for attempt in $(seq 1 20); do redis-cli ping | grep -q PONG && break; sleep 1; done
          redis-cli ping | grep -q PONG
          redis-server --version

      - name: Run backend tests and independent holdout release contract
        env:
          PHISHGUARD_TEST_REDIS_PORT: "6379"
        run: python -m unittest discover -s website/tests -v

      - name: Test localhost evaluation server boundaries
        run: python website/tools/vision-benchmark/test_server.py

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify pinned recognition assets
        run: node website/tools/vision-assets/verify.mjs

      - name: Run frontend tests
        run: node --test website/static/*.test.mjs

      - name: Test the visual-regression static server
        run: node --test website/tools/visual/server.test.mjs

      - name: Check JavaScript syntax
        # Every tracked script except vendored copies, so a new file cannot be missed.
        run: git ls-files -z -- '*.js' '*.mjs' ':!:website/static/vendor/**' | xargs -0 -n1 node --check

  visual:
    name: Visual regression (Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Chromium build, fonts and OS libraries are part of every screenshot, so the
    # suite runs only in this pinned image; the committed baselines come from the
    # same image (visual-baselines.yml). Keep the tag equal to @playwright/test
    # in website/tools/visual/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: keep the token out of .git/config

      # Node comes from the image; this step only caches npm downloads.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: website/tools/visual/package-lock.json

      - name: Install the pinned Playwright test runner
        run: npm ci --prefix website/tools/visual --no-audit --no-fund

      - name: Compare screenshots with the committed baselines
        run: node website/tools/visual/run.mjs --committed

      - name: Upload expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs
          path: website/tools/visual/.output/
          if-no-files-found: ignore
          retention-days: 14

  optional-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: keep the token out of .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/tools/enhanced_vision/requirements.txt
      - name: Install optional local OCR dependencies
        run: python -m pip install -r website/tools/enhanced_vision/requirements.txt
      - name: Test actual local image decoder, provider boundary and OCR engine
        run: python -m unittest website.tools.enhanced_vision.test_provider -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test image engine comparison and local-only transport
        run: node --test website/static/vision-engine-comparison.test.mjs
