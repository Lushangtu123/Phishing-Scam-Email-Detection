name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned linter
        run: python -m pip install ruff==0.16.9

      - name: Lint Python for definite defects (ruff.toml)
        run: ruff check --output-format github .

  vercel-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Vercel runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke-test committed Vercel profile and model
        run: python website/tests/vercel_runtime_smoke.py

      - name: Smoke-test synthetic controls (not release evidence)
        run: |
          python website/tools/evaluate_public_corpus.py --manifest website/tests/fixtures/evaluation/manifest.json --output /tmp/evaluation-candidate.json
          python website/tools/compare_evaluations.py --baseline website/tests/fixtures/evaluation/baseline.json --candidate /tmp/evaluation-candidate.json

      - name: Check Vercel dependency consistency
        run: python -m pip check

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        # The official image through Amazon ECR Public: Docker Hub's anonymous pull limit
        # and timeouts stopped the test jobs before they ran (2026-10-09).
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests and independent holdout release contract
        env:
          PHISHGUARD_TEST_REDIS_PORT: "6379"
        run: python -m unittest discover -s website/tests -v

      - name: Test localhost evaluation server boundaries
        run: python website/tools/vision-benchmark/test_server.py

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify pinned recognition assets
        run: node website/tools/vision-assets/verify.mjs

      - name: Run frontend tests
        run: node --test website/static/*.test.mjs

      - name: Test the visual-regression static server
        run: node --test website/tools/visual/server.test.mjs

      - name: Check JavaScript syntax
        # Every tracked script except vendored copies, so a new file cannot be missed.
        run: git ls-files -z -- '*.js' '*.mjs' ':!:website/static/vendor/**' | xargs -0 -n1 node --check

  visual:
    name: Visual regression (Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Chromium build, fonts and OS libraries are part of every screenshot, so the
    # suite runs only in this pinned image; the committed baselines come from the
    # same image (visual-baselines.yml). Keep the tag equal to @playwright/test
    # in website/tools/visual/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      # Node comes from the image; this step only caches npm downloads.
      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: website/tools/visual/package-lock.json

      - name: Install the pinned Playwright test runner
        run: npm ci --prefix website/tools/visual --no-audit --no-fund

      - name: Compare screenshots with the committed baselines
        run: node website/tools/visual/run.mjs --committed

      - name: Upload expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: website/tools/visual/.output/
          if-no-files-found: ignore
          retention-days: 14

  optional-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/tools/enhanced_vision/requirements.txt
      - name: Install optional local OCR dependencies
        run: python -m pip install -r website/tools/enhanced_vision/requirements.txt
      - name: Test actual local image decoder, provider boundary and OCR engine
        run: python -m unittest website.tools.enhanced_vision.test_provider -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test image engine comparison and local-only transport
        run: node --test website/static/vision-engine-comparison.test.mjs
