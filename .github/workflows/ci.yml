name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned linter
        run: python -m pip install ruff==0.16.9

      - name: Lint Python for definite defects (ruff.toml)
        run: ruff check --output-format github .

  vercel-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Vercel runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke-test committed Vercel profile and model
        run: python website/tests/vercel_runtime_smoke.py

      - name: Smoke-test synthetic controls (not release evidence)
        run: |
          python website/tools/evaluate_public_corpus.py --manifest website/tests/fixtures/evaluation/manifest.json --output /tmp/evaluation-candidate.json
          python website/tools/compare_evaluations.py --baseline website/tests/fixtures/evaluation/baseline.json --candidate /tmp/evaluation-candidate.json

      - name: Check Vercel dependency consistency
        run: python -m pip check

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            website/requirements.txt
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests and independent holdout release contract
        env:
          PHISHGUARD_TEST_REDIS_PORT: "6379"
        run: python -m unittest discover -s website/tests -v

      - name: Test localhost evaluation server boundaries
        run: python website/tools/vision-benchmark/test_server.py

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify pinned recognition assets
        run: node website/tools/vision-assets/verify.mjs

      - name: Run frontend tests
        run: node --test website/static/*.test.mjs

      - name: Test the visual-regression static server
        run: node --test website/tools/visual/server.test.mjs

      - name: Check JavaScript syntax
        run: |
          node --check website/static/lang-init.js
          node --check website/static/i18n.js
          node --check website/static/i18n-zh.js
          node --check website/static/request.js
          node --check website/static/app-core.js
          node --check website/static/app-theme.js
          node --check website/static/app-layout.js
          node --check website/static/app-config.js
          node --check website/static/app-sender.js
          node --check website/static/app-verify.js
          node --check website/static/app-content.js
          node --check website/static/app-content-render.js
          node --check website/static/app-reports.js
          node --check website/static/app-metrics.js
          node --check website/static/app.js
          node --check website/static/cases.js
          node --check website/static/cases-theme.js
          node --check website/static/vision.js
          node --check website/static/file-intake.js
          node --check website/static/confirm-dialog.js
          node --check website/static/feedback.js
          node --check website/tests/fixtures/i18n/cases-scenarios.mjs
          node --check website/tests/fixtures/i18n/capture-cases.mjs
          node --check website/static/vision-core.mjs
          node --check website/static/vision-email.mjs
          node --check website/static/vision-worker.mjs
          node --check website/tools/vision-benchmark/harness.mjs
          node --check website/tools/vision-benchmark/metrics.mjs
          node --check website/tools/vision-benchmark/evaluate-service.mjs
          node --check website/tools/vision-benchmark/compare-engines.mjs
          node --check website/tools/vision-benchmark/holdout.mjs
          node --check website/tools/visual/server.mjs
          node --check website/tools/visual/scenarios.mjs
          node --check website/tools/visual/visual.spec.mjs
          node --check website/tools/visual/playwright.config.mjs
          node --check website/tools/visual/run.mjs
          node --check website/tools/visual/capture-fixtures.mjs
          node --check website/tools/visual/server.test.mjs

  optional-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/tools/enhanced_vision/requirements.txt
      - name: Install optional local OCR dependencies
        run: python -m pip install -r website/tools/enhanced_vision/requirements.txt
      - name: Test actual local image decoder, provider boundary and OCR engine
        run: python -m unittest website.tools.enhanced_vision.test_provider -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test image engine comparison and local-only transport
        run: node --test website/static/vision-engine-comparison.test.mjs
